name: Deploy to Cloudflare Pages

# 免费额度（docs/08）：20,000 个文件、**单文件 ≤25 MiB**、500 次构建/月、带宽不计量。
#
# ⚠️ 单文件 25 MiB 是这条路线唯一的硬伤，而现在超限的是 **4 个文件**：
#
#   1 个 wasm：`ort-wasm-simd-threaded.asyncify.wasm`（26,861,777 字节）
#   3 个模型：自托管之后，`models/` 下的 .onnx 一片就是 29–57 MiB
#
# 这两类的性质完全不同（见 docs/07 的 R13 和 R15）：
#
#   · **wasm 能外置**：把那个 wasm 上传成**本仓库的 GitHub Release 资产**，
#     然后在仓库 Settings → Secrets and variables → Actions → Variables 里加一个
#     变量 `VITE_ORT_WASM_BASE`，值形如
#       https://github.com/<你>/<仓库>/releases/download/wasm-v1/
#     本 workflow 会把它透传给构建；vite.config.ts 的 ortWasmPolicy 插件
#     据此把超大 wasm 从产物里剔除，运行时再由 lib/ortEnv.ts 交给 ORT。
#     （Release 资产同样是免费的，无需任何付费账号。）
#
#   · **模型不能外置**：外置就等于回到「运行时从第三方 CDN 取权重」，
#     而那正是这次改造要消灭的东西（huggingface.co 实测 0/3 不通）。
#     减小模型清单也没用 —— q8 量化下每一片都超过 25 MiB。
#
# 所以结论是：**GitHub Pages 是唯一无损路线**，这条 workflow 在模型自托管之后
# 实际上走不通了，除非愿意把模型放回第三方 CDN。留着它是为了将来
# 「只发一个纯转写/不带动模型的版本」时还能用。

# ⚠️ 这条工作流**故意只手动触发**，不在 push 时自动跑。
# 原因：它需要 2 个仓库 secret（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）
# 和一个 Variable（VITE_ORT_WASM_BASE），没配齐时它必然失败。如果跟着 push 跑，
# 每次提交都会在 Actions 页面留一条红色记录，让人误以为代码有问题。
# GitHub Pages 那条才是主路线；等确实需要第二个源站时，再来手动点这一条。
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 和生成 pnpm-lock.yaml 的版本对齐（见 deploy-pages.yml 的说明）。
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Zero-cost guard
        run: pnpm lint:cost

      # 模型随站点发布，和 GitHub Pages 那条一样（见 deploy-pages.yml 的说明）。
      - name: Fetch models（约 160MB）
        env:
          HF_HOST: https://huggingface.co
        run: pnpm fetch-models

      - name: Build
        # base 用默认的 '/'：Cloudflare Pages 部署在根路径。
        # VITE_SITE_URL 没配的话留空即可 —— 此时 og:image 保持相对路径，
        # 只影响部分分享平台的缩略图，不影响功能。
        env:
          VITE_BASE: /
          VITE_ORT_WASM_BASE: ${{ vars.VITE_ORT_WASM_BASE }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: pnpm build

      - name: Size gate (Cloudflare Pages 单文件上限 25 MiB)
        run: node scripts/check-upload-size.mjs

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=simulnote --branch=main
