name: Deploy to GitHub Pages

# 免费额度（docs/08）：站点 ≤1GB、软带宽 100GB/月。没有单文件大小限制，
# 所以这个源站可以完整地带上 ONNX Runtime 的 wasm（约 26.8MB）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的 push 取消排队中的旧任务，但不打断正在进行的发布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # 项目站点部署在 /<仓库名>/ 子路径下，base 必须跟着走，否则所有
        # 静态资源都会 404（这是 GitHub Pages 项目站最常见的坑）。
        #
        # 例外：如果仓库名恰好是 `<用户名>.github.io`（用户站），它部署在根路径，
        # 此时要把 VITE_BASE 改成 `/`，VITE_SITE_URL 改成 `https://<用户名>.github.io/`。
        #
        # VITE_SITE_URL 只用于把 og:image 补成绝对地址（微信/TG 的预览卡片需要），
        # 写错只影响分享缩略图，不影响功能。
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: pnpm build

      - name: Zero-cost guard
        run: pnpm lint:cost

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
